<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug - ゴブコパ</title>
  </head>
  <body>
    <div id="root">Loading...</div>
    <script type="module">
      console.log('Debug script loaded');

      // Check if React is available
      try {
        import('react')
          .then(React => {
            console.log('React loaded successfully:', React);
          })
          .catch(err => {
            console.error('Failed to load React:', err);
          });
      } catch (err) {
        console.error('Error importing React:', err);
      }

      // Check if the main module loads
      try {
        import('./src/main.tsx')
          .then(main => {
            console.log('Main module loaded successfully');
          })
          .catch(err => {
            console.error('Failed to load main module:', err);
          });
      } catch (err) {
        console.error('Error importing main module:', err);
      }
    </script>
  </body>
</html>
