<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>顧客詳細テスト</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .test-section {
        margin: 20px 0;
        padding: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      button {
        margin: 5px;
        padding: 10px 15px;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        background: #007bff;
        color: white;
      }
      .result {
        margin: 10px 0;
        padding: 10px;
        border-radius: 3px;
        background: #f8f9fa;
      }
      .error {
        background: #f8d7da;
        color: #721c24;
      }
      .success {
        background: #d4edda;
        color: #155724;
      }
    </style>
  </head>
  <body>
    <h1>🔍 顧客詳細画面テスト</h1>

    <div class="test-section">
      <h2>📊 現在の状況</h2>
      <div id="currentStatus" class="result">
        <strong>フロントエンドURL:</strong> <span id="frontendUrl"></span><br />
        <strong>現在時刻:</strong> <span id="currentTime"></span>
      </div>
    </div>

    <div class="test-section">
      <h2>🌐 APIテスト</h2>
      <button onclick="testCustomerAPI()">顧客API直接テスト</button>
      <div id="apiResult" class="result"></div>
    </div>

    <div class="test-section">
      <h2>🔗 ルーティングテスト</h2>
      <p>
        以下のリンクをクリックして、顧客詳細画面が表示されるかテストしてください：
      </p>
      <div>
        <a
          href="http://localhost:5174/customers/list"
          target="_blank"
          style="
            margin: 5px;
            padding: 10px;
            background: #17a2b8;
            color: white;
            text-decoration: none;
            border-radius: 3px;
            display: inline-block;
          "
          >顧客一覧</a
        >
        <a
          href="http://localhost:5174/customers/CUST001"
          target="_blank"
          style="
            margin: 5px;
            padding: 10px;
            background: #ffc107;
            color: black;
            text-decoration: none;
            border-radius: 3px;
            display: inline-block;
          "
          >顧客詳細 (CUST001)</a
        >
        <a
          href="http://localhost:5174/customers/CUST002"
          target="_blank"
          style="
            margin: 5px;
            padding: 10px;
            background: #ffc107;
            color: black;
            text-decoration: none;
            border-radius: 3px;
            display: inline-block;
          "
          >顧客詳細 (CUST002)</a
        >
        <a
          href="http://localhost:5174/customers/CUST003"
          target="_blank"
          style="
            margin: 5px;
            padding: 10px;
            background: #ffc107;
            color: black;
            text-decoration: none;
            border-radius: 3px;
            display: inline-block;
          "
          >顧客詳細 (CUST003)</a
        >
      </div>
    </div>

    <script>
      const API_BASE_URL = 'http://localhost:3001/api';

      function updateCurrentStatus() {
        document.getElementById('frontendUrl').textContent =
          window.location.href;
        document.getElementById('currentTime').textContent =
          new Date().toLocaleString('ja-JP');
      }

      async function testCustomerAPI() {
        const resultDiv = document.getElementById('apiResult');

        try {
          // 顧客一覧取得
          const listResponse = await fetch(`${API_BASE_URL}/customers/list`);
          const listData = await listResponse.json();

          if (listData.success && listData.customers.length > 0) {
            const firstCustomer = listData.customers[0];

            // 顧客詳細取得
            const detailResponse = await fetch(
              `${API_BASE_URL}/customers/details?customerId=${firstCustomer.customerId}`
            );
            const detailData = await detailResponse.json();

            resultDiv.className = 'result success';
            resultDiv.innerHTML = `
              <strong>✅ API接続成功</strong><br>
              <strong>顧客一覧:</strong> ${listData.count}件<br>
              <strong>テスト顧客:</strong> ${firstCustomer.customerId} - ${firstCustomer.name}<br>
              <strong>詳細取得:</strong> ${detailData.success ? '成功' : '失敗'}<br>
              <details>
                <summary>詳細データ</summary>
                <pre>${JSON.stringify(detailData.customer, null, 2)}</pre>
              </details>
            `;
          } else {
            resultDiv.className = 'result error';
            resultDiv.innerHTML = `
              <strong>❌ 顧客データなし</strong><br>
              データベースに顧客データが存在しません
            `;
          }
        } catch (error) {
          resultDiv.className = 'result error';
          resultDiv.innerHTML = `
            <strong>❌ API接続失敗</strong><br>
            エラー: ${error.message}
          `;
        }
      }

      // ページ読み込み時の初期化
      window.onload = function () {
        updateCurrentStatus();
        testCustomerAPI();
      };

      // 1分ごとに状態を更新
      setInterval(updateCurrentStatus, 60000);
    </script>
  </body>
</html>
